<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>External PiP</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <video id="pip-video" autoplay playsinline></video>
      <div class="chrome">
        <div class="drag-spacer"></div>
        <button id="play-pause" class="icon-button" title="Play/Pause" type="button" aria-label="Play/Pause">
          <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zM13 5h3v14h-3z"></path></svg>
          <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
        </button>
        <div class="volume-control">
          <button id="volume" class="icon-button" title="Volume" type="button" aria-label="Volume">
            <svg class="icon icon-volume" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.4 8.6l1.4-1.4A6.8 6.8 0 0 1 20 12a6.8 6.8 0 0 1-2.2 4.8l-1.4-1.4A4.9 4.9 0 0 0 18 12a4.9 4.9 0 0 0-1.6-3.4z"></path></svg>
          </button>
          <div class="volume-panel">
            <input id="volume-slider" class="range-control volume-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
          </div>
        </div>
        <button id="pin" class="icon-button active" title="Pin window" type="button" aria-label="Pin window">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3l7 7-2 2-1.2-1.2-4.5 4.5.7 4.7-1.5 1.5-4.2-4.2L4 22l-1.5-1.5 4.2-4.2-4.2-4.2L4 10.6l4.7.7 4.5-4.5L12 5z"></path></svg>
        </button>
        <button id="close" class="icon-button" title="Close" type="button" aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"></path></svg>
        </button>
      </div>
      <div class="timeline">
        <input id="seek-bar" class="range-control seek-bar" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek">
      </div>
    </main>
    <script src="../node_modules/hls.js/dist/hls.min.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
